<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Walk the real world and catch the shadow people hiding in it." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Shadozman</title>
  </head>
  <body>
    <div id="app">
      <main id="screen-map" class="screen active">
        <div id="map"></div>
        <div id="hud-top">
          <span class="brand">SHADOZMAN</span>
          <span id="gps-status" class="pill">Locating…</span>
        </div>
        <button id="recenter" class="fab" aria-label="Recenter on me" hidden>◎</button>
      </main>
      <section id="screen-collection" class="screen" aria-label="Collection">
        <header class="screen-header"><h1>Shadowdex</h1></header>
        <div id="collection-root"></div>
      </section>
      <nav id="tabbar">
        <button data-screen="map" class="active">Map</button>
        <button data-screen="collection">Shadowdex</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
