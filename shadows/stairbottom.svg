<rect x="64" y="200" width="162" height="26" fill="#1b1924"/><rect x="98" y="174" width="128" height="26" fill="#16141e"/><rect x="132" y="148" width="94" height="26" fill="#1b1924"/><rect x="166" y="122" width="60" height="26" fill="#16141e"/><rect x="200" y="96" width="26" height="26" fill="#1b1924"/><rect x="0" y="226" width="256" height="30" fill="#16141e"/>
<g filter="url(#wisp)">
