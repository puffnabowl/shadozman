<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hollowchild</title>
<defs>
<radialGradient id="aura" cx="128" cy="150" r="100" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffcf6b" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#ffcf6b" stop-opacity="0.12"/>
<stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.7" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="25" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#ffcf6b" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><g mask="url(#hole)"><path d="M110.9,140.2 Q104,144.8 98,154.8 L95,184 Q94,198 100,200 L103,188 L105,167.7 Q102,184.6 103,222 L108,232.5 L113,218.5 L118,235.6 L123,218.5 L128,235.1 L133,222 Q134,184.6 131,167.7 L133,188 L136,200 Q142,198 141,184 L138,154.8 Q132,144.8 125.1,140.2Z"/><ellipse cx="118" cy="123" rx="17" ry="19"/></g></g>
<mask id="hole"><rect width="256" height="256" fill="#fff"/><circle cx="118" cy="175" r="9" fill="#000"/></mask>
</defs>
<circle cx="128" cy="150" r="100" fill="url(#aura)"/>

<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>

<g fill="#ffcf6b" filter="url(#glow)"><circle cx="112" cy="125" r="3"/><circle cx="124" cy="125" r="3"/></g>
<circle cx="118" cy="175" r="6" fill="#ffcf6b" filter="url(#glow)"/><path d="M140 189Q158 123 176 73" fill="none" stroke="#2c2838" stroke-width="2"/>
