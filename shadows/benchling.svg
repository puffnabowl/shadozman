<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Benchling</title>
<defs>
<radialGradient id="aura" cx="128" cy="150" r="90" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ffd8a8" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#ffd8a8" stop-opacity="0.12"/>
<stop offset="1" stop-color="#ffd8a8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="1" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="21" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#ffd8a8" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><path d="M108 168q-6-36 20-42q26 6 20 42l2 22h-8v26l-6-4v-22h-16v22l-6 4v-26h-8z"/><ellipse cx="128" cy="112" rx="16" ry="17"/></g>

</defs>
<circle cx="128" cy="150" r="90" fill="url(#aura)"/>
<rect x="40" y="150" width="176" height="8" rx="3" fill="#2c2838"/><rect x="40" y="132" width="176" height="8" rx="3" fill="#2c2838"/>
<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>
<rect x="34" y="186" width="188" height="10" rx="3" fill="#1b1924"/><rect x="50" y="196" width="8" height="40" fill="#1b1924"/><rect x="198" y="196" width="8" height="40" fill="#1b1924"/><rect x="118" y="160" width="20" height="5" rx="1" fill="#ffd8a8" opacity=".55"/>
<g fill="#ffd8a8" filter="url(#glow)"><circle cx="123" cy="114" r="2.4"/><circle cx="133" cy="114" r="2.4"/></g>

</svg>
