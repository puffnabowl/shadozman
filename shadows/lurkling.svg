<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lurkling</title>
<defs>
<radialGradient id="aura" cx="150" cy="150" r="100" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#b8a6ff" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#b8a6ff" stop-opacity="0.12"/>
<stop offset="1" stop-color="#b8a6ff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.7" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#b8a6ff" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><path d="M140.8,166.8 Q133.2,173.7 126,183.7 L123,205.9 Q122,219.9 128,221.9 L131,209.9 L133,194.3 Q130.8,191.5 132,224 L138,234.9 L144,220.5 L150,235.5 L156,220.5 L162,237.6 L168,224 Q169.2,191.5 167,194.3 L169,209.9 L172,221.9 Q178,219.9 177,205.9 L174,183.7 Q166.8,173.7 159.2,166.8Z"/><ellipse cx="150" cy="144.6" rx="22" ry="24.6"/></g>

</defs>
<circle cx="150" cy="150" r="100" fill="url(#aura)"/>

<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>
<rect x="78" y="40" width="70" height="200" fill="#1b1924"/><rect x="146" y="40" width="3" height="200" fill="#2c2838"/><rect x="141" y="168" width="12" height="5" rx="2.5" fill="#0a0910"/><rect x="141" y="175" width="12" height="5" rx="2.5" fill="#0a0910"/><rect x="141" y="182" width="12" height="5" rx="2.5" fill="#0a0910"/>
<g fill="#b8a6ff" filter="url(#glow)"><circle cx="144.5" cy="146.6" r="3.8"/><circle cx="159.5" cy="146.6" r="3.8"/></g>

</svg>
