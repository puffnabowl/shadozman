<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hooded Choir</title>
<defs>
<radialGradient id="aura" cx="128" cy="120" r="124" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ff6bd6" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#ff6bd6" stop-opacity="0.12"/>
<stop offset="1" stop-color="#ff6bd6" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.7" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="26" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#ff6bd6" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><path d="M70 82q26.9 4 29.4 38.4q6.4 60 5.8 111.6L43.6,239.8L52.4,229L61.2,243.3L70,229L78.8,242.9L87.6,229L96.4,240.4L34.8,232q-0.6 -111.6 5.8 -111.6q2.6 -35.8 29.4 -38.4z"/><path d="M186 82q26.9 4 29.4 38.4q6.4 60 5.8 111.6L159.6,243.8L168.4,229L177.2,243.7L186,229L194.8,239.5L203.6,229L212.4,239.6L150.8,232q-0.6 -111.6 5.8 -111.6q2.6 -35.8 29.4 -38.4z"/><path d="M128 50q31.9 4 35 45.6q7.6 74.4 6.8 140.4L96.6,244.3L107.1,233L117.5,245.8L128,233L138.4,245L148.9,233L159.4,246.1L86.2,236q-0.8 -140.4 6.8 -140.4q3 -42.6 35 -45.6z"/></g>

</defs>
<circle cx="128" cy="120" r="124" fill="url(#aura)"/>

<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>
<ellipse cx="70" cy="112" rx="15" ry="18" fill="#000"/><ellipse cx="186" cy="112" rx="15" ry="18" fill="#000"/><ellipse cx="128" cy="86" rx="18" ry="22" fill="#000"/>
