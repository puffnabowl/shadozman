<path d="M100 36q8-10 16 0t16 0" fill="none" stroke="#ff6bd6" stroke-opacity=".4" stroke-width="1.5"/><path d="M150 26q8-10 16 0t16 0" fill="none" stroke="#ff6bd6" stroke-opacity=".4" stroke-width="1.5"/><path d="M40 60q8-10 16 0t16 0" fill="none" stroke="#ff6bd6" stroke-opacity=".4" stroke-width="1.5"/><path d="M190 54q8-10 16 0t16 0" fill="none" stroke="#ff6bd6" stroke-opacity=".4" stroke-width="1.5"/>
