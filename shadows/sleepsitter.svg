<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sleepsitter</title>
<defs>
<radialGradient id="aura" cx="128" cy="120" r="110" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#a07bff" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#a07bff" stop-opacity="0.12"/>
<stop offset="1" stop-color="#a07bff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="1" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="18" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#a07bff" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><path d="M92 176q-6-40 16-70q16-20 40-16q30 8 30 44q0 26-10 42l-6 40l-6-36l-8 2l-6-4l-8 4l-8-4l-8 4l-8-4l-6 38z"/><path d="M100 120q-24 30-26 92l6 2q6-50 30-80z"/><path d="M166 120q20 34 22 92l-6 2q-6-54-24-82z"/><ellipse cx="124" cy="96" rx="22" ry="20"/><path d="M108 82l-6-20l14 14zM140 82l8-20l-2 22z"/></g>

</defs>
<circle cx="128" cy="120" r="110" fill="url(#aura)"/>
<rect x="20" y="176" width="216" height="36" rx="6" fill="#1b1924"/><rect x="20" y="170" width="216" height="10" rx="5" fill="#2c2838"/><rect x="24" y="212" width="10" height="28" fill="#1b1924"/><rect x="222" y="212" width="10" height="28" fill="#1b1924"/>
<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>

<g fill="#a07bff" filter="url(#glow)"><circle cx="116" cy="98" r="4"/><circle cx="132" cy="98" r="4"/></g>

</svg>
