<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Graveshade</title>
<defs>
<radialGradient id="aura" cx="128" cy="110" r="110" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#7dffd4" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#7dffd4" stop-opacity="0.12"/>
<stop offset="1" stop-color="#7dffd4" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.7" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="23" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#7dffd4" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><path d="M120.4,84.3 Q106.3,89.4 97,99.4 L84,149.4 Q83,163.4 89,165.4 L92,153.4 L104,116.4 Q103.2,143.5 104.8,190 L110.6,203.6 L116.4,186.5 L122.2,203.7 L128,186.5 L133.8,203.4 L139.6,186.5 L145.4,198.9 L151.2,190 Q152.8,143.5 152,116.4 L164,153.4 L167,165.4 Q173,163.4 172,149.4 L159,99.4 Q149.7,89.4 135.6,84.3Z"/><ellipse cx="128" cy="66.2" rx="18" ry="20.2"/></g>

</defs>
<circle cx="128" cy="110" r="110" fill="url(#aura)"/>

<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>
<path d="M84 240v-74q0-36 44-36t44 36v74z" fill="#1b1924"/><path d="M84 240v-74q0-36 44-36t44 36v74" fill="none" stroke="#2c2838" stroke-width="3"/><path d="M106 176h44M110 190h36M114 204h28" stroke="#2c2838" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="20" y="236" width="216" height="20" fill="#16141e"/><ellipse cx="128" cy="236" rx="110" ry="14" fill="#7dffd4" opacity=".18" filter="url(#haze)"/>
<g fill="#7dffd4" filter="url(#glow)"><circle cx="121.5" cy="68.2" r="3"/><circle cx="134.5" cy="68.2" r="3"/></g>

</svg>
