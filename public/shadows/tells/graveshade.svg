<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>graveshade</title>
<defs>
<radialGradient id="dark" cx="128" cy="128" r="124" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#000" stop-opacity="0.85"/>
<stop offset="0.6" stop-color="#000" stop-opacity="0.55"/>
<stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aura" cx="128" cy="128" r="110" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#7dffd4" stop-opacity="0.3"/>
<stop offset="1" stop-color="#7dffd4" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
