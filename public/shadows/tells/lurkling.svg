<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>lurkling</title>
<defs>
<radialGradient id="dark" cx="128" cy="128" r="124" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#000" stop-opacity="0.85"/>
<stop offset="0.6" stop-color="#000" stop-opacity="0.55"/>
<stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
<radialGradient id="aura" cx="128" cy="128" r="110" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#b8a6ff" stop-opacity="0.3"/>
<stop offset="1" stop-color="#b8a6ff" stop-opacity="0"/>
</radialGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="rim" x="-30%" y="-30%" width="160%" height="160%">
<feMorphology in="SourceAlpha" operator="dilate" radius="2" result="d"/>
<feGaussianBlur in="d" stdDeviation="3" result="b"/>
<feFlood flood-color="#b8a6ff" flood-opacity="0.7"/>
<feComposite in2="b" operator="in" result="r"/>
<feMerge><feMergeNode in="r"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="1" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<circle cx="128" cy="128" r="124" fill="url(#dark)"/>
<circle cx="128" cy="128" r="110" fill="url(#aura)"/>
<g transform="rotate(0 98 124)"><path d="M78 124Q98 100 118 124Q98 148 78 124z" fill="#b8a6ff" filter="url(#glow)"/><path d="M78 124Q98 100 118 124Q98 148 78 124z" fill="#fff" opacity=".35" transform="translate(29.4 37.2) scale(.7)"/><circle cx="98" cy="124" r="7.2" fill="#000"/></g><g transform="rotate(0 158 124)"><path d="M138 124Q158 100 178 124Q158 148 138 124z" fill="#b8a6ff" filter="url(#glow)"/><path d="M138 124Q158 100 178 124Q158 148 138 124z" fill="#fff" opacity=".35" transform="translate(47.4 37.2) scale(.7)"/><circle cx="158" cy="124" r="7.2" fill="#000"/></g>
</svg>
