<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Duskcrown</title>
<defs>
<radialGradient id="aura" cx="128" cy="130" r="120" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#ff7a3d" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#ff7a3d" stop-opacity="0.12"/>
<stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
