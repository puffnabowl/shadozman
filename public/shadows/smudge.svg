<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Smudge</title>
<defs>
<radialGradient id="aura" cx="128" cy="130" r="100" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#d8d2e8" stop-opacity="0.42"/>
<stop offset="0.55" stop-color="#d8d2e8" stop-opacity="0.12"/>
<stop offset="1" stop-color="#d8d2e8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#0a0910"/>
<stop offset="0.6" stop-color="#0a0910" stop-opacity="0.97"/>
<stop offset="0.9" stop-color="#0a0910" stop-opacity="0"/>
</linearGradient>
<filter id="wisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="14" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
<feMorphology in="SourceAlpha" operator="dilate" radius="1.6" result="d"/>
<feGaussianBlur in="d" stdDeviation="2.4" result="b"/>
<feFlood flood-color="#d8d2e8" flood-opacity="0.55"/>
<feComposite in2="b" operator="in"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="haze" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
<g id="sil" fill="url(#body)"><g filter="url(#haze)"><path d="M118.8,116.8 Q103.5,123.7 93,133.7 L90,180.7 Q89,194.7 95,196.7 L98,184.7 L100,150.7 Q100,167.5 101.8,214 L110.5,223 L119.2,210.5 L128,226.3 L136.8,210.5 L145.5,226.1 L154.2,214 Q156,167.5 156,150.7 L158,184.7 L161,196.7 Q167,194.7 166,180.7 L163,133.7 Q152.5,123.7 137.2,116.8Z"/><ellipse cx="128" cy="94.6" rx="22" ry="24.6"/></g></g>

</defs>
<circle cx="128" cy="130" r="100" fill="url(#aura)"/>
<rect x="34" y="34" width="188" height="188" rx="10" fill="none" stroke="#2c2838" stroke-width="3" stroke-dasharray="26 136"/>
<g filter="url(#wisp)">
<use href="#sil" filter="url(#rim)"/>
<use href="#sil"/>
</g>

<g fill="#d8d2e8" filter="url(#glow)"><circle cx="134" cy="94.6" r="4"/></g>

